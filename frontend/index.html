<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collaborative CRDT Editor</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
    #app { width: 100%; max-width: 800px; padding: 20px; box-sizing: border-box; }
    .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
    input { width: 100%; padding: 12px; margin: 10px 0 20px 0; background: #0f172a; border: 1px solid #475569; border-radius: 6px; color: white; box-sizing: border-box; font-size: 14px; }
    button { width: 100%; padding: 12px; background: #3b82f6; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; transition: background 0.2s; }
    button:hover { background: #2563eb; }
    .error { color: #ef4444; font-size: 13px; margin-top: -10px; margin-bottom: 15px; text-align: center; }
    .switch-text { text-align: center; margin-top: 15px; font-size: 14px; color: #94a3b8; cursor: pointer; }
    .switch-text span { color: #3b82f6; text-decoration: underline; }
  </style>
</head>
<body>

  <!-- Single dynamic root container -->
  <div id="app"></div>

  <!-- Load our compiled frontend router -->
  <script type="module" src="./dist/app.js"></script>
</body>
</html>
